[package]
name = "sonixx-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust desktop app for Sonixx."

[[bin]]
name = "sonixx"
path = "src/main.rs"

[dependencies]
sonixx-core = { path = "../sonixx-core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "system_fonts"] }
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
